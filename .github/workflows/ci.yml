name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  container:
    name: Build and smoke test Docker image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: api-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container health
        shell: bash
        run: |
          node -e "console.log(require('node:crypto').generateKeyPairSync('rsa', {modulusLength: 2048, publicKeyEncoding: {type: 'spki', format: 'pem'}}).publicKey)" > "$RUNNER_TEMP/auth-public.pem"
          docker run -d --name gateway-ci -p 127.0.0.1:8080:8080 \
            -e JWT_PUBLIC_KEY_PATH=/run/secrets/auth_public_key \
            --mount "type=bind,src=$RUNNER_TEMP/auth-public.pem,dst=/run/secrets/auth_public_key,readonly" \
            api-gateway:ci
          trap 'docker logs gateway-ci; docker rm -f gateway-ci' EXIT
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/health/ready
