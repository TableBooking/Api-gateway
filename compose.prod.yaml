# Standalone image-only deployment; no build context or source code required.
services:
  gateway:
    image: ${GATEWAY_IMAGE:?Set GATEWAY_IMAGE to a Docker Hub version or digest}
    init: true
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-10000}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:?Set AUTH_SERVICE_URL}
      BOOKING_SERVICE_URL: ${BOOKING_SERVICE_URL:?Set BOOKING_SERVICE_URL}
      OPERATIONS_SERVICE_URL: ${OPERATIONS_SERVICE_URL:?Set OPERATIONS_SERVICE_URL}
      TRACKING_SERVICE_URL: ${TRACKING_SERVICE_URL:?Set TRACKING_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:?Set NOTIFICATION_SERVICE_URL}
      JWT_PUBLIC_KEY_PATH: /run/secrets/auth_public_key
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE}
    secrets:
      - auth_public_key
    networks:
      - platform
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

secrets:
  auth_public_key:
    file: ${JWT_PUBLIC_KEY_FILE:-./keys/auth-public.pem}

networks:
  platform:
    external: true
    name: ${PLATFORM_NETWORK:-tablebooking-platform}
